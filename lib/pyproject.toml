[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-web-source"
version = "0.1.0"
description = "Web and feed data source for Blue Data Intelligence"
authors = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]
maintainers = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]
requires-python = ">=3.10"
dependencies = [
    # Sibling packages are installed editable from their own lib/ dirs (see
    # scripts/install.sh / docs/installation.md). Plain requirements are used
    # rather than `@ file:../../...` URLs, which pip resolves against the current
    # working directory — not this file — so they never point at the sibling. #45
    "blue-data>=0.1.0",
    "blue-data-doc-source>=0.1.0",
    "httpx>=0.27.0",
    "trafilatura>=1.9.0",
    # trafilatura imports lxml.html.clean, which lxml >= 5.2 no longer ships in the
    # core package — it moved to the separate lxml_html_clean distribution (also the
    # lxml[html_clean] extra). trafilatura does not declare it, so a fresh install
    # resolving lxml >= 5.2 (e.g. 6.1.x) fails to `import trafilatura` and every
    # page-extraction op breaks. Declare it explicitly so the install is complete. #80
    "lxml_html_clean>=0.4.0",
]

[project.optional-dependencies]
openai  = ["openai>=1.0.0"]
redis   = ["redis[hiredis]>=4.5.0"]
llm     = ["anthropic>=0.40.0"]
feed    = ["feedparser>=6.0.0"]
search  = ["tavily-python>=0.3.0"]
dev     = ["pytest", "pytest-cov", "pytest-httpx", "feedparser>=6.0.0"]
all     = ["openai>=1.0.0", "redis[hiredis]>=4.5.0", "anthropic>=0.40.0", "feedparser>=6.0.0", "tavily-python>=0.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["lib/tests/unit"]
markers = [
    "integration: end-to-end tests requiring external services (Redis, network)",
]
