[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "blue-data-web-source"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "blue-data>=0.1.0",
    "blue-data-doc-source>=0.1.0",
    "httpx>=0.27.0",
    "trafilatura>=1.9.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
redis = ["redis[hiredis]>=4.5.0"]
dev = ["pytest", "pytest-cov", "pytest-httpx"]

[tool.setuptools.packages.find]
where = ["src"]
