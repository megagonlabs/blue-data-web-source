[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-web-api"
version = "1.0.0"
description = "REST API for blue-data-web-source"
authors = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]
maintainers = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "blue-data-web-source>=1.0.0",
    # Shared server policy: loopback bind, API-key auth, and CSRF guard
    # (blue_data.server). The [server] extra provides the helper. #75 / XR-08.
    "blue-data[server]>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
redis  = ["redis[hiredis]>=4.5.0"]
feed   = ["feedparser>=6.0.0"]
dev    = ["pytest", "httpx"]

[project.scripts]
blue-data-web-api = "web_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]
