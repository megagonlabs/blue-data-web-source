[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-web-cli"
version = "1.0.0"
description = "Command-line interface for blue-data-web-source"
authors = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]
maintainers = [
    {name = "Jalal Mahmud", email = "contact_oss@megagon.ai"},
]
requires-python = ">=3.10"
dependencies = [
    "blue-data-web-source>=1.0.0",
    "click>=8.0",
]

[project.optional-dependencies]
openai  = ["openai>=1.0.0"]
redis   = ["redis[hiredis]>=4.5.0"]
dev     = ["pytest", "pytest-cov"]
all     = ["openai>=1.0.0", "redis[hiredis]>=4.5.0"]

[project.scripts]
blue-web = "blue_data_web_cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
